name: flutter_ui_toolbox
description: "Flutter UI Toolbox is a lightweight and easy-to-use package that provides essential extensions to simplify UI development in Flutter."

#publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.6
repository: https://github.com/DevNimesh75/flutter_ui_toolbox
issue_tracker: https://github.com/DevNimesh75/flutter_ui_toolbox/issues

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #general packages
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  shared_preferences: ^2.5.3
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8
  connectivity_plus: ^7.0.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/

topics:
  - widgets
  - extensions
  - utils
  - chatgpt
  - flutterutils